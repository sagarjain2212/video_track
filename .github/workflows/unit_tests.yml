name: Unit Test Check

on:
  pull_request:
    branches:
      - development # Triggers only for PRs targeting development
    types: [opened, synchronize, reopened]

  push:
    branches:
      - development

env:
  # Opts into Node 24 immediately to satisfy the runner requirements
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        # This runs all local unit tests for all build variants
        run: ./gradlew test

      - name: Upload Test Report
        if: always() # Uploads results even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  build:
    needs: test # Only runs if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          # Path to the generated APK
          path: app/build/outputs/apk/debug/app-debug.apk